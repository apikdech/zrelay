# zrelay deployment (design §8.3). Start it with deploy/deploy.sh.
#
# Zero-disk is enforced here: read_only root filesystem, no volumes and no
# tmpfs. The config and the Docker secrets are mounted read-only files.
#
# Files next to this compose file (never committed):
#   .env                     ENV: references (S3_ENDPOINT, S3_ACCESS_KEY,
#                            RESTREAM_USER, RESTREAM_PASS, CAMERA_*)
#   zrelay.yaml              the config, from zrelay.example.yaml
#   zview.yaml               the zview-server config, from zview.example.yaml
#   secrets/zrelay_master    the zk1- master key
#   secrets/s3_secret_key    the relay's MinIO secret key
#   secrets/api_token_sha256 hex(SHA-256(K_api)); read by zrelay and zview-server
#   secrets/s3_ro_secret_key zview-server's read-only MinIO secret key
#                            (.env also needs S3_RO_ACCESS_KEY)
#
# .env is passed to zrelay whole (env_file). zview-server gets only
# S3_ENDPOINT and S3_RO_ACCESS_KEY, interpolated from .env by compose, so the
# camera, restream and relay S3 credentials never enter its environment.
#
# Inside the container, zrelay.yaml must set relay.http_listen to
# "0.0.0.0:9464" for the loopback-only publish below to reach /metrics;
# the host side stays bound to 127.0.0.1. live.listen (9465) is not
# published: zview-server reaches it over the compose network (Task 28).
name: zrelay

services:
  zrelay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.zrelay
    image: zrelay:local
    restart: unless-stopped
    read_only: true
    # zrelay drains or drops its backlog within relay.shutdown_grace_seconds
    # (default 30) after SIGTERM; Docker's default 10 s would SIGKILL it first.
    # Keep this above shutdown_grace_seconds in zrelay.yaml.
    stop_grace_period: 40s
    env_file: .env
    environment:
      TAILSCALE_IP: ${TAILSCALE_IP:?TAILSCALE_IP is unset; run deploy/deploy.sh}
    configs:
      - source: zrelay_config
        target: /etc/zrelay/zrelay.yaml
    secrets:
      - zrelay_master
      - s3_secret_key
      - api_token_sha256
    ports:
      - "${TAILSCALE_IP}:8554:8554/tcp"   # RTSP restream
      - "${TAILSCALE_IP}:8189:8189/udp"   # WebRTC ICE
      - "127.0.0.1:9464:9464/tcp"         # /healthz /metrics, loopback only
    ulimits:
      core: 0

  # zview-server (design §8.3): SPA, /api/v1/* and the /live/* proxy on one
  # origin. Only loopback is published; `tailscale serve` fronts it with
  # HTTPS. It reaches zrelay's live signaling as http://zrelay:9465 over the
  # compose network. Read-only root, no volumes and no tmpfs, and the S3
  # credentials are read-only.
  zview-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.zview
    image: zview:local
    restart: unless-stopped
    read_only: true
    # Only what zview.yaml references. It must not get .env wholesale: that
    # holds the camera and restream passwords and the relay's S3 key, none of
    # which a network-facing, read-only viewer may reach.
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is unset in deploy/.env}
      S3_RO_ACCESS_KEY: ${S3_RO_ACCESS_KEY:?S3_RO_ACCESS_KEY is unset in deploy/.env}
    configs:
      - source: zview_config
        target: /etc/zview/zview.yaml
    secrets:
      - api_token_sha256
      - s3_ro_secret_key
    ports:
      - "127.0.0.1:8080:8080/tcp"         # for `tailscale serve`
    ulimits:
      core: 0

configs:
  zrelay_config:
    file: ./zrelay.yaml
  zview_config:
    file: ./zview.yaml

secrets:
  zrelay_master:
    file: ./secrets/zrelay_master
  s3_secret_key:
    file: ./secrets/s3_secret_key
  api_token_sha256:
    file: ./secrets/api_token_sha256
  s3_ro_secret_key:
    file: ./secrets/s3_ro_secret_key
